[project]
name = "readability-checker"
version = "0.1.0"
description = "中文文案可读性测试工具 - 评估文案是否适合小学五年级学生理解"
readme = "README.md"
authors = [
    { name = "Nick", email = "Nick20260000@github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "streamlit>=1.28.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.scripts]
readability-cli = "readability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readability"]
